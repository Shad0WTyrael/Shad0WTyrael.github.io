<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320,height=320,initial-scale=1.0">
<title>NZXT Kraken Z3 — Oni HUD</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 320px;
    height: 320px;
    overflow: hidden;
    background: #000;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: #dffcff;
}

#screen {
    position: relative;
    width: 320px;
    height: 320px;
    overflow: hidden;
    background: #000;
    border-radius: 50%;
    clip-path: circle(50% at 50% 50%);
}

#background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: .72;
    filter: brightness(.48) contrast(1.2) saturate(1.2);
}

#screen::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0,110,255,.08) 48%,
            rgba(0,0,0,.7) 82%,
            rgba(0,0,0,.96) 100%
        );
}

#screen::after {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: 20;
    border: 1px solid rgba(85,225,255,.75);
    border-radius: 50%;
    box-shadow:
        0 0 8px rgba(0,180,255,.65),
        inset 0 0 20px rgba(0,100,255,.25);
    pointer-events: none;
}

/* HEADER */

.header {
    position: absolute;
    z-index: 8;
    top: 25px;
    left: 58px;
    right: 58px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1px;
}

.title {
    color: #78eaff;
    text-shadow: 0 0 7px #00aaff;
}

.status {
    color: #72ffda;
    text-shadow: 0 0 6px #00ffc8;
}

/* GAUGES */

.gauge {
    position: absolute;
    z-index: 9;
    width: 82px;
    text-align: center;
}

#cpu {
    left: 34px;
    top: 62px;
}

#gpu {
    right: 34px;
    top: 62px;
}

#ram {
    left: 34px;
    bottom: 49px;
}

#kraken {
    right: 34px;
    bottom: 49px;
}

.gauge-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #66dfff;
    text-shadow: 0 0 6px #00aaff;
    margin-bottom: 2px;
}

.gauge-value {
    font-size: 27px;
    line-height: 27px;
    font-weight: 800;
    color: #efffff;
    text-shadow:
        0 0 6px #00bfff,
        0 0 14px rgba(0,180,255,.8);
}

.gauge-unit {
    font-size: 8px;
    font-weight: 600;
    color: #9cdeea;
    letter-spacing: 1px;
}

/* DATA CARDS */

.card {
    position: absolute;
    z-index: 9;
    width: 83px;
    font-size: 8px;
    line-height: 13px;
    color: #8bd5e4;
}

.card strong {
    color: #efffff;
    font-size: 9px;
}

.card-left {
    left: 38px;
    top: 158px;
    text-align: left;
}

.card-right {
    right: 38px;
    top: 158px;
    text-align: right;
}

.card-line {
    white-space: nowrap;
}

/* CENTER */

.center {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: 112px;
    height: 112px;
    border-radius: 50%;
    pointer-events: none;
}

.center-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(55,210,255,.38);
    border-radius: 50%;
    box-shadow:
        0 0 14px rgba(0,170,255,.25),
        inset 0 0 14px rgba(0,170,255,.15);
}

.center-ring::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px dashed rgba(82,226,255,.3);
    border-radius: 50%;
}

/* BADGE */

.badge {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 135px;
    transform: translateX(-50%);
    padding: 4px 9px;
    border: 1px solid rgba(79,220,255,.55);
    border-radius: 20px;
    color: #8beeff;
    background: rgba(0,20,35,.45);
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
    text-shadow: 0 0 5px #00bfff;
}

/* LIGNES */

.line {
    position: absolute;
    z-index: 5;
    height: 1px;
    background: rgba(60,210,255,.45);
    box-shadow: 0 0 5px rgba(0,180,255,.5);
}

.line.left {
    left: 22px;
    top: 52%;
    width: 43px;
}

.line.right {
    right: 22px;
    top: 52%;
    width: 43px;
}

/* ARC */

.arc {
    position: absolute;
    z-index: 4;
    width: 240px;
    height: 240px;
    left: 40px;
    top: 40px;
    border: 1px solid rgba(60,205,255,.14);
    border-radius: 50%;
}

/* FOOTER */

.footer {
    position: absolute;
    z-index: 10;
    left: 57px;
    right: 57px;
    bottom: 25px;
    display: flex;
    justify-content: space-between;
    font-size: 6px;
    font-weight: 600;
    letter-spacing: 1px;
    color: rgba(126,221,238,.75);
}

/* DANGER */

.danger .gauge-value {
    color: #ff5276;
    text-shadow:
        0 0 6px #ff003d,
        0 0 14px rgba(255,0,70,.85);
}

#screen.danger::after {
    border-color: rgba(255,45,90,.85);
    box-shadow:
        0 0 10px rgba(255,0,60,.8),
        inset 0 0 20px rgba(255,0,60,.25);
}
</style>
</head>

<body>

<div id="screen">

    <img
        id="background"
        src="crowned-enigma-in-blue-light-backiee-4K.jpg"
        alt=""
    >

    <div class="arc"></div>

    <div class="header">
        <span class="title">ONI // KRAKEN Z3</span>
        <span id="status" class="status">WAITING CAM</span>
    </div>

    <div id="cpu" class="gauge">
        <div class="gauge-label">CPU</div>
        <div id="cpuTemp" class="gauge-value">--</div>
        <div class="gauge-unit">°C</div>
    </div>

    <div id="gpu" class="gauge">
        <div class="gauge-label">GPU</div>
        <div id="gpuTemp" class="gauge-value">--</div>
        <div class="gauge-unit">°C</div>
    </div>

    <div id="ram" class="gauge">
        <div class="gauge-label">RAM</div>
        <div id="ramPercent" class="gauge-value">--</div>
        <div class="gauge-unit">%</div>
    </div>

    <div id="kraken" class="gauge">
        <div class="gauge-label">LIQUID</div>
        <div id="liquidTemp" class="gauge-value">--</div>
        <div class="gauge-unit">°C</div>
    </div>

    <div class="card card-left">
        <div class="card-line">LOAD <strong id="cpuLoad">--</strong></div>
        <div class="card-line">FREQ <strong id="cpuFreq">--</strong></div>
        <div class="card-line">POWER <strong id="cpuPower">--</strong></div>
    </div>

    <div class="card card-right">
        <div class="card-line">LOAD <strong id="gpuLoad">--</strong></div>
        <div class="card-line">FREQ <strong id="gpuFreq">--</strong></div>
        <div class="card-line">POWER <strong id="gpuPower">--</strong></div>
    </div>

    <div class="center">
        <div class="center-ring"></div>
    </div>

    <div class="badge">
        REAL-TIME SYSTEM MONITOR
    </div>

    <div class="line left"></div>
    <div class="line right"></div>

    <div class="footer">
        <span>NZXT CAM</span>
        <span>LIVE DATA</span>
    </div>

</div>

<script>
"use strict";

const screen = document.getElementById("screen");
const statusEl = document.getElementById("status");

const cpuTempEl = document.getElementById("cpuTemp");
const cpuLoadEl = document.getElementById("cpuLoad");
const cpuFreqEl = document.getElementById("cpuFreq");
const cpuPowerEl = document.getElementById("cpuPower");

const gpuTempEl = document.getElementById("gpuTemp");
const gpuLoadEl = document.getElementById("gpuLoad");
const gpuFreqEl = document.getElementById("gpuFreq");
const gpuPowerEl = document.getElementById("gpuPower");

const ramPercentEl = document.getElementById("ramPercent");
const liquidTempEl = document.getElementById("liquidTemp");

function percent(value) {
    if (value === null || value === undefined) return "--";
    const n = Number(value);
    return Number.isFinite(n) ? `${(n * 100).toFixed(0)}%` : "--";
}

function temp(value) {
    if (value === null || value === undefined) return "--";
    const n = Number(value);
    return Number.isFinite(n) ? n.toFixed(0) : "--";
}

function mhz(value) {
    if (value === null || value === undefined) return "--";
    const n = Number(value);
    return Number.isFinite(n) ? `${n.toFixed(0)} MHz` : "--";
}

function watts(value) {
    if (value === null || value === undefined) return "--";
    const n = Number(value);
    return Number.isFinite(n) ? `${n.toFixed(0)} W` : "--";
}

function update(data) {

    if (!data) return;

    const cpu = data.cpus?.[0] || null;
    const gpu = data.gpus?.[0] || null;
    const ram = data.ram || null;
    const kraken = data.kraken || null;

    /* CPU */

    cpuTempEl.textContent = cpu
        ? temp(cpu.temperature)
        : "--";

    cpuLoadEl.textContent = cpu
        ? percent(cpu.load)
        : "--";

    cpuFreqEl.textContent = cpu
        ? mhz(cpu.frequency)
        : "--";

    cpuPowerEl.textContent = cpu
        ? watts(cpu.power)
        : "--";

    /* GPU */

    gpuTempEl.textContent = gpu
        ? temp(gpu.temperature)
        : "--";

    gpuLoadEl.textContent = gpu
        ? percent(gpu.load)
        : "--";

    gpuFreqEl.textContent = gpu
        ? mhz(gpu.frequency)
        : "--";

    gpuPowerEl.textContent = gpu
        ? watts(gpu.power)
        : "--";

    /* RAM - CAM fournit des MiB */

    if (
        ram &&
        ram.totalSize != null &&
        ram.inUse != null
    ) {
        const total = Number(ram.totalSize);
        const used = Number(ram.inUse);

        if (total > 0 && Number.isFinite(used)) {
            ramPercentEl.textContent =
                ((used / total) * 100).toFixed(0);
        } else {
            ramPercentEl.textContent = "--";
        }
    } else {
        ramPercentEl.textContent = "--";
    }

    /* LIQUIDE KRAKEN */

    liquidTempEl.textContent =
        kraken?.liquidTemperature != null
            ? temp(kraken.liquidTemperature)
            : "--";

    /* DANGER */

    const cpuDanger =
        cpu?.temperature != null &&
        Number(cpu.temperature) >= 80;

    const gpuDanger =
        gpu?.temperature != null &&
        Number(gpu.temperature) >= 80;

    const danger = cpuDanger || gpuDanger;

    screen.classList.toggle("danger", danger);
    statusEl.classList.toggle("danger", danger);

    statusEl.textContent =
        danger ? "DANGER" : "CAM LIVE";
}

/* NZXT CAM Web Integration */

window.nzxt = window.nzxt || {};
window.nzxt.v1 = window.nzxt.v1 || {};
window.nzxt.v1.onMonitoringDataUpdate = update;
</script>

</body>
</html>
