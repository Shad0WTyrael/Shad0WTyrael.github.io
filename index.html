<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320,height=320,initial-scale=1.0">
<title>NZXT Kraken Z3 — Oni HUD</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 320px;
    height: 320px;
    overflow: hidden;
    background: #000;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: #dffcff;
}

/* =========================
   CIRCULAR KRAKEN DISPLAY
   ========================= */

#screen {
    position: relative;
    width: 320px;
    height: 320px;
    overflow: hidden;
    background: #000;
    border-radius: 50%;
    clip-path: circle(50% at 50% 50%);
}

/* Background */
#background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: .82;
    filter:
        brightness(.58)
        contrast(1.18)
        saturate(1.15);
}

/* Blue atmospheric overlay */
#screen::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(0, 110, 255, .08) 48%,
            rgba(0, 0, 0, .72) 82%,
            rgba(0, 0, 0, .95) 100%
        );
}

/* Circular glass border */
#screen::after {
    content: "";
    position: absolute;
    inset: 2px;
    z-index: 20;
    border: 1px solid rgba(85, 225, 255, .75);
    border-radius: 50%;
    box-shadow:
        0 0 8px rgba(0, 180, 255, .65),
        inset 0 0 20px rgba(0, 100, 255, .25);
    pointer-events: none;
}

/* =========================
   TOP HUD
   ========================= */

.header {
    position: absolute;
    z-index: 8;
    top: 19px;
    left: 48px;
    right: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 7px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.title {
    color: #78eaff;
    text-shadow: 0 0 7px #00aaff;
}

.status {
    color: #72ffda;
    text-shadow: 0 0 6px #00ffc8;
}

.status.danger {
    color: #ff426e;
    text-shadow: 0 0 7px #ff003d;
}

/* =========================
   CENTER
   ========================= */

.center {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 49%;
    transform: translate(-50%, -50%);
    width: 105px;
    height: 105px;
    border-radius: 50%;
    pointer-events: none;
}

.center-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(55, 210, 255, .38);
    border-radius: 50%;
    box-shadow:
        0 0 12px rgba(0, 170, 255, .2),
        inset 0 0 12px rgba(0, 170, 255, .12);
}

.center-ring::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px dashed rgba(82, 226, 255, .28);
    border-radius: 50%;
}

.center-ring::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    transform: translate(-50%, -50%);
    background: #a9f8ff;
    border-radius: 50%;
    box-shadow: 0 0 9px #00d9ff;
}

/* =========================
   GAUGES
   ========================= */

.gauge {
    position: absolute;
    z-index: 9;
    width: 68px;
    text-align: center;
}

#cpu {
    left: 25px;
    top: 61px;
}

#gpu {
    right: 25px;
    top: 61px;
}

#ram {
    left: 25px;
    bottom: 42px;
}

#kraken {
    right: 25px;
    bottom: 42px;
}

.gauge-label {
    font-size: 7px;
    letter-spacing: 1.3px;
    color: #66dfff;
    text-shadow: 0 0 5px #00aaff;
    margin-bottom: 3px;
}

.gauge-value {
    font-size: 20px;
    line-height: 20px;
    font-weight: 700;
    color: #e8fdff;
    text-shadow:
        0 0 5px #00bfff,
        0 0 12px rgba(0, 180, 255, .7);
}

.gauge-unit {
    font-size: 6px;
    color: #8fd8e8;
    letter-spacing: 1px;
}

/* =========================
   DATA CARDS
   ========================= */

.card {
    position: absolute;
    z-index: 9;
    width: 68px;
    font-size: 6px;
    line-height: 10px;
    color: #83cbd9;
}

.card strong {
    color: #d9fbff;
    font-size: 7px;
}

.card-left {
    left: 43px;
    top: 148px;
    text-align: left;
}

.card-right {
    right: 43px;
    top: 148px;
    text-align: right;
}

.card-line {
    white-space: nowrap;
}

/* =========================
   CENTRAL BADGE
   ========================= */

.badge {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 133px;
    transform: translateX(-50%);
    padding: 3px 8px;
    border: 1px solid rgba(79, 220, 255, .5);
    border-radius: 20px;
    color: #8beeff;
    background: rgba(0, 20, 35, .38);
    font-size: 5px;
    letter-spacing: 1.4px;
    white-space: nowrap;
    text-shadow: 0 0 5px #00bfff;
}

/* =========================
   FOOTER
   ========================= */

.footer {
    position: absolute;
    z-index: 10;
    left: 44px;
    right: 44px;
    bottom: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 5px;
    letter-spacing: 1px;
    color: rgba(126, 221, 238, .7);
}

/* =========================
   DECORATIVE HUD LINES
   ========================= */

.line {
    position: absolute;
    z-index: 5;
    height: 1px;
    background: rgba(60, 210, 255, .4);
    box-shadow: 0 0 5px rgba(0, 180, 255, .45);
}

.line.left {
    left: 22px;
    top: 52%;
    width: 48px;
}

.line.right {
    right: 22px;
    top: 52%;
    width: 48px;
}

.arc {
    position: absolute;
    z-index: 4;
    width: 230px;
    height: 230px;
    left: 45px;
    top: 45px;
    border: 1px solid rgba(60, 205, 255, .16);
    border-radius: 50%;
}

/* =========================
   DANGER MODE
   ========================= */

.danger .gauge-value {
    color: #ff5276;
    text-shadow:
        0 0 5px #ff003d,
        0 0 13px rgba(255, 0, 70, .8);
}

#screen.danger::after {
    border-color: rgba(255, 45, 90, .85);
    box-shadow:
        0 0 10px rgba(255, 0, 60, .8),
        inset 0 0 20px rgba(255, 0, 60, .25);
}

/* =========================
   NO DATA
   ========================= */

[data-value] {
    min-width: 1px;
}
</style>
</head>

<body>

<div id="screen">

    <img
        id="background"
        src="crowned-enigma-in-blue-light-backiee-4K.jpg"
        alt=""
    >

    <div class="arc"></div>

    <div class="header">
        <span class="title">ONI // KRAKEN Z3</span>
        <span id="status" class="status">WAITING CAM</span>
    </div>

    <!-- CPU -->
    <div id="cpu" class="gauge">
        <div class="gauge-label">CPU</div>
        <div id="cpuTemp" class="gauge-value">--</div>
        <div class="gauge-unit">°C</div>
    </div>

    <!-- GPU -->
    <div id="gpu" class="gauge">
        <div class="gauge-label">GPU</div>
        <div id="gpuTemp" class="gauge-value">--</div>
        <div class="gauge-unit">°C</div>
    </div>

    <!-- RAM -->
    <div id="ram" class="gauge">
        <div class="gauge-label">RAM</div>
        <div id="ramPercent" class="gauge-value">--</div>
        <div class="gauge-unit">%</div>
    </div>

    <!-- KRAKEN -->
    <div id="kraken" class="gauge">
        <div class="gauge-label">LIQUID</div>
        <div id="liquidTemp" class="gauge-value">--</div>
        <div class="gauge-unit">°C</div>
    </div>

    <!-- CPU DATA -->
    <div class="card card-left">
        <div class="card-line">LOAD <strong id="cpuLoad">--</strong></div>
        <div class="card-line">FREQ <strong id="cpuFreq">--</strong></div>
        <div class="card-line">POWER <strong id="cpuPower">--</strong></div>
    </div>

    <!-- GPU DATA -->
    <div class="card card-right">
        <div class="card-line">LOAD <strong id="gpuLoad">--</strong></div>
        <div class="card-line">FREQ <strong id="gpuFreq">--</strong></div>
        <div class="card-line">POWER <strong id="gpuPower">--</strong></div>
    </div>

    <div class="center">
        <div class="center-ring"></div>
    </div>

    <div class="badge">
        REAL-TIME SYSTEM MONITOR
    </div>

    <div class="line left"></div>
    <div class="line right"></div>

    <div class="footer">
        <span>NZXT CAM</span>
        <span>LIVE DATA</span>
    </div>

</div>

<script>
"use strict";

/*
    NZXT CAM Web Integration
    LIVE DATA ONLY
    Aucun chiffre simulé.
*/

const screen = document.getElementById("screen");
const statusEl = document.getElementById("status");

const cpuTempEl = document.getElementById("cpuTemp");
const cpuLoadEl = document.getElementById("cpuLoad");
const cpuFreqEl = document.getElementById("cpuFreq");
const cpuPowerEl = document.getElementById("cpuPower");

const gpuTempEl = document.getElementById("gpuTemp");
const gpuLoadEl = document.getElementById("gpuLoad");
const gpuFreqEl = document.getElementById("gpuFreq");
const gpuPowerEl = document.getElementById("gpuPower");

const ramPercentEl = document.getElementById("ramPercent");
const liquidTempEl = document.getElementById("liquidTemp");

function valueOrDash(value) {
    return value === null ||
           value === undefined ||
           Number.isNaN(Number(value))
        ? "--"
        : value;
}

function temp(value) {
    if (value === null || value === undefined) return "--";
    return `${Number(value).toFixed(0)}`;
}

function percent(value) {
    if (value === null || value === undefined) return "--";
    return `${(Number(value) * 100).toFixed(0)}`;
}

function mhz(value) {
    if (value === null || value === undefined) return "--";
    return `${Number(value).toFixed(0)} MHz`;
}

function watts(value) {
    if (value === null || value === undefined) return "--";
    return `${Number(value).toFixed(0)} W`;
}

function update(data) {

    if (!data) return;

    const cpu =
        Array.isArray(data.cpus) && data.cpus.length
            ? data.cpus[0]
            : null;

    const gpu =
        Array.isArray(data.gpus) && data.gpus.length
            ? data.gpus[0]
            : null;

    const ram = data.ram || null;
    const kraken = data.kraken || null;

    /* =========================
       CPU
       ========================= */

    if (cpu) {
        cpuTempEl.textContent = temp(cpu.temperature);
        cpuLoadEl.textContent = percent(cpu.load) === "--"
            ? "--"
            : `${percent(cpu.load)}%`;
        cpuFreqEl.textContent = mhz(cpu.frequency);
        cpuPowerEl.textContent = watts(cpu.power);
    } else {
        cpuTempEl.textContent = "--";
        cpuLoadEl.textContent = "--";
        cpuFreqEl.textContent = "--";
        cpuPowerEl.textContent = "--";
    }

    /* =========================
       GPU
       ========================= */

    if (gpu) {
        gpuTempEl.textContent = temp(gpu.temperature);
        gpuLoadEl.textContent = percent(gpu.load) === "--"
            ? "--"
            : `${percent(gpu.load)}%`;
        gpuFreqEl.textContent = mhz(gpu.frequency);
        gpuPowerEl.textContent = watts(gpu.power);
    } else {
        gpuTempEl.textContent = "--";
        gpuLoadEl.textContent = "--";
        gpuFreqEl.textContent = "--";
        gpuPowerEl.textContent = "--";
    }

    /* =========================
       RAM
       NZXT CAM: MiB
       ========================= */

    if (
        ram &&
        ram.totalSize !== null &&
        ram.totalSize !== undefined &&
        ram.inUse !== null &&
        ram.inUse !== undefined
    ) {
        const totalMiB = Number(ram.totalSize);
        const usedMiB = Number(ram.inUse);

        if (
            Number.isFinite(totalMiB) &&
            Number.isFinite(usedMiB) &&
            totalMiB > 0
        ) {
            const ramPercent =
                (usedMiB / totalMiB) * 100;

            ramPercentEl.textContent =
                ramPercent.toFixed(0);
        } else {
            ramPercentEl.textContent = "--";
        }
    } else {
        ramPercentEl.textContent = "--";
    }

    /* =========================
       KRAKEN LIQUID
       ========================= */

    if (
        kraken &&
        kraken.liquidTemperature !== null &&
        kraken.liquidTemperature !== undefined
    ) {
        liquidTempEl.textContent =
            Number(kraken.liquidTemperature).toFixed(0);
    } else {
        liquidTempEl.textContent = "--";
    }

    /* =========================
       DANGER
       ========================= */

    const cpuDanger =
        cpu &&
        cpu.temperature !== null &&
        cpu.temperature !== undefined &&
        Number(cpu.temperature) >= 80;

    const gpuDanger =
        gpu &&
        gpu.temperature !== null &&
        gpu.temperature !== undefined &&
        Number(gpu.temperature) >= 80;

    const danger = cpuDanger || gpuDanger;

    screen.classList.toggle("danger", danger);
    statusEl.classList.toggle("danger", danger);

    statusEl.textContent =
        danger ? "DANGER" : "CAM LIVE";
}


/*
    NZXT CAM API
*/

window.nzxt = window.nzxt || {};
window.nzxt.v1 = window.nzxt.v1 || {};

window.nzxt.v1.onMonitoringDataUpdate = update;


/*
    Respecte la forme fournie par CAM.
    Pour le Kraken Z3, le layout reste circulaire.
*/

if (window.nzxt.v1.shape === "circle") {
    document.documentElement.classList.add("round");
}


/*
    Taille cible CAM.
*/

if (window.nzxt.v1.width && window.nzxt.v1.height) {
    // Aucun redimensionnement forcé :
    // le Kraken Z3 utilise son canvas 320x320.
}
</script>

</body>
</html>
